        content="Get in touch with TechHelp for professional web development and technical support services.">

    <!-- Scripts -->

    <script src="scripts/hamburguer.js" defer></script>
    <script src="scripts/lastmodify.js" defer></script>
    <script src="scripts/wayfinder.js" defer></script>

<body>
    <header>
        <img src="images/coding.svg" alt="Site logo" loading="lazy">
        <h1>TechHelp</h1>
        <button id="ham-btn" class="hamburger" aria-label="Toggle navigation menu"></button>
    </header>

    <nav id="nav-bar" class="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="contact-form ">
            <div class="center">
                <h2>Request a Quote or Service</h2>
            </div>
            <form id="service-form" class="contact-form" method="get" action="formresponse.html">

                <label for="fullname">Full Name:</label>
                <input id="fullname" type="text" name="fullname" required>

                <div class="two-cols">
                    <div class="form-field">
                        <label for="phone">Phone:</label>
                        <input id="phone" type="tel" name="phone" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email:</label>
                        <input id="email" type="email" name="email" required>
                    </div>
                </div>

                <label for="service">Service Interested In:</label>
                <select id="service" name="service" required>
                    <option value="">--Select Service--</option>
                    <option value="website">Website Creation</option>
                    <option value="maintenance">Software Maintenance</option>
                    <option value="webapp">Custom Web App</option>
                    <option value="consultation">Consultation & Quote</option>
                </select>

                <label for="message">Details / Questions:</label>
                <textarea id="message" name="message" required></textarea>

                <div class="center">
                    <button type="submit">Submit Request</button>
                </div>

            </form>

        </section>

    </main>

    <footer>
        <div>
            <a href="https://www.linkedin.com/in/RonyReyes" target="_blank"><img src="images/linkedin.svg"
                    alt="linked in logo" width="16" height="16" loading="lazy"></a>
            <a href="https://www.facebook.com/rony.reyes.7165331" target="_blank"><img src="images/facebook.svg"
                    alt="facebook logo" width="16" height="16" loading="lazy"></a>
            <a href="https://github.com/RonyReyesWeb" target="_blank"><img src="images/github.svg" alt="github logo"
                    width="16" height="16" loading="lazy"></a>
        </div>
        <p>&copy; <span id="currentyear"></span> ❖ Rony Reyes</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
